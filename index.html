<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MASTERED CRM — Mastered Skill Academy</title>
    <meta name="description" content="Mastered Skill Academy CRM & Sales Performance System" />
    
    <!-- PWA & Device Support -->
    <meta name="theme-color" content="#0B3A66" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mastered CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Mastered CRM" />

    <!-- Icons & Manifest -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-[#F5F8FC] text-[#17212B] select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
